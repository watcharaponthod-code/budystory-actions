name: tag-products

# ปักตะกร้าสินค้า (YouTube Shopping) ใน Studio — Data API ไม่มี endpoint นี้
# 2026-11-24 ผู้ใช้สั่ง: ไม่รันบนเครื่องตัวเอง → รันบนเครื่องของ GitHub (ubuntu-latest) ด้วย cookie ล็อกอิน Google ใน secret
# Cloudflare Worker budystory-upload บอกคลิปที่ต้องปัก (/tagtodo) และจดผล (/tagdone) · ไม่มีคลิปค้าง = ไม่เปิดเบราว์เซอร์
# ความปลอดภัย: ยิงได้เฉพาะ schedule กับ workflow_dispatch · ห้ามอัป screenshot/trace เป็น artifact (repo public)

on:
  schedule:
    - cron: '5,20,35,50 3-7 * * *'   # ทุก 15 นาที 10:05-14:50 เวลาไทย (ช่วงที่ worker ลงคลิป)
    - cron: '5 8 * * *'              # 15:05 เก็บตก
  workflow_dispatch:
    inputs:
      days: { description: 'ย้อนหลังกี่วัน', required: false, default: '3' }
      limit: { description: 'ปักสูงสุดกี่คลิป', required: false, default: '5' }
      dry: { description: 'dry-run (ค้นอย่างเดียว ไม่กดจริง)', required: false, default: 'false' }

permissions:
  contents: read

concurrency:
  group: tag-products
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      CF_RUN_KEY: ${{ secrets.CF_RUN_KEY }}
      DAYS: ${{ github.event.inputs.days || '7' }}
      LIMIT: ${{ github.event.inputs.limit || '5' }}
      DRY: ${{ github.event.inputs.dry || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything to tag?
        id: todo
        run: |
          n=$(curl -sf -m 60 "$WORKER_URL/tagtodo?days=$DAYS&key=$CF_RUN_KEY" | jq length)
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "clips to tag: $n"
      - name: Tag products in YouTube Studio
        if: steps.todo.outputs.n != '0'
        env:
          YT_STORAGE_STATE: ${{ secrets.YT_STORAGE_STATE }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          node scripts/tag_cloud.mjs
